<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Keyboard Fantasia Admin</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&family=Inter:wght@400;600&family=Rajdhani:wght@500;600&display=swap"
    rel="stylesheet">

  <style>
    :root {
      --led-green: #00FF41;
      --led-green-dim: #00AA2B;
      --led-red: #FF3333;
      --led-cyan: #00FFFF;
      --silver-dark: #A0A0A0;
      --steel-dark: #6B6E70;

      --font-display: 'Orbitron', monospace;
      --font-body: 'Inter', sans-serif;
      --font-tech: 'Rajdhani', sans-serif;

      --gap-xs: 4px;
      --gap-sm: 8px;
      --gap-md: 16px;
      --gap-lg: 24px;
      --gap-xl: 32px;
      --radius-md: 8px;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: var(--font-body);
      background: #05050a;
      color: #fff;
    }

    /* Auth Overlay */
    .auth-overlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(5, 5, 15, 0.95);
      opacity: 0;
      transition: opacity 0.5s ease;
      pointer-events: none;
    }

    .auth-overlay.is-visible {
      opacity: 1;
      pointer-events: auto;
    }

    .auth-card {
      width: 380px;
      max-width: 90vw;
      background: linear-gradient(145deg, rgba(30, 33, 37, 0.95) 0%, rgba(15, 15, 20, 0.98) 100%);
      border: 1px solid rgba(0, 255, 65, 0.15);
      border-radius: 16px;
      padding: var(--gap-xl);
      text-align: center;
    }

    .auth-card__icon {
      font-size: 2.5rem;
      margin-bottom: var(--gap-md);
    }

    .auth-card__title {
      font-family: var(--font-display);
      font-size: 1.3rem;
      color: var(--led-green);
      margin-bottom: var(--gap-xs);
    }

    .auth-card__subtitle {
      font-family: var(--font-tech);
      font-size: 0.85rem;
      color: var(--silver-dark);
      margin-bottom: var(--gap-xl);
    }

    .admin-input-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 12px;
      text-align: left;
    }

    .admin-input-group label {
      font-family: var(--font-tech);
      font-size: 0.8rem;
      color: var(--silver-dark);
    }

    .admin-input-group input {
      background: #000;
      border: 1px solid var(--steel-dark);
      color: #fff;
      padding: 10px;
      font-family: var(--font-body);
      border-radius: 4px;
    }

    .admin-form-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 12px;
      text-align: left;
    }

    .admin-form-group label {
      font-family: var(--font-tech);
      font-size: 0.8rem;
      color: var(--silver-dark);
    }

    .admin-form-group input,
    .admin-form-group select {
      background: #000;
      border: 1px solid var(--steel-dark);
      color: #fff;
      padding: 10px;
      font-family: var(--font-body);
      border-radius: 4px;
    }

    .upload-status {
      font-family: var(--font-tech);
      font-size: 0.75rem;
      color: var(--silver-dark);
      margin-top: 2px;
    }

    .admin-submit-btn {
      width: 100%;
      padding: 12px;
      background: var(--led-green);
      color: #000;
      border: none;
      border-radius: 4px;
      font-family: var(--font-display);
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
    }

    .admin-grid-container {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      align-items: flex-start;
    }

    .admin-card {
      flex: 1 1 340px;
      min-width: 0;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: var(--gap-md);
      border-radius: var(--radius-md);
    }

    .admin-card h3 {
      font-family: var(--font-display);
      color: var(--led-cyan);
      margin-bottom: var(--gap-md);
      margin-top: 0;
      font-size: 1rem;
    }

    .asset-status-summary {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--steel-dark);
      border-radius: 4px;
      padding: 8px 12px;
      margin-bottom: 12px;
    }

    .asset-status-summary p {
      margin: 4px 0;
      font-family: var(--font-tech);
      font-size: 0.8rem;
    }

    .auth-error {
      color: var(--led-red);
      font-family: var(--font-tech);
      font-size: 0.9rem;
      margin-bottom: 12px;
      display: none;
    }

    .google-signin-btn {
      width: 100%;
      padding: 14px;
      background: var(--led-green);
      color: #000;
      border: none;
      border-radius: 8px;
      font-family: var(--font-display);
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 8px;
    }

    .google-signin-btn:hover {
      background: var(--led-green-dim);
    }

    .guest-btn {
      width: 100%;
      padding: 12px;
      background: transparent;
      border: 1px solid var(--steel-dark);
      color: var(--silver-dark);
      border-radius: 8px;
      cursor: pointer;
    }

    /* Admin Dashboard */
    #admin-dashboard {
      display: none;
      flex-direction: column;
      padding: var(--gap-lg);
      max-width: 900px;
      margin: 0 auto;
    }

    #admin-dashboard.is-open {
      display: flex;
    }

    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--led-green);
      padding-bottom: var(--gap-md);
      margin-bottom: var(--gap-lg);
    }

    .admin-title {
      font-family: var(--font-display);
      font-size: 1.5rem;
      color: var(--led-green);
    }

    .admin-close {
      background: transparent;
      border: 1px solid var(--led-red);
      color: var(--led-red);
      padding: 8px 16px;
      cursor: pointer;
      border-radius: 4px;
    }

    .admin-panel {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: var(--gap-md);
      border-radius: var(--radius-md);
    }

    .admin-panel h3 {
      font-family: var(--font-display);
      color: var(--led-cyan);
      margin-bottom: var(--gap-md);
      margin-top: 0;
      font-size: 1rem;
    }

    .admin-btn {
      background: var(--led-green-dim);
      color: #000;
      border: none;
      padding: 10px 16px;
      font-family: var(--font-display);
      cursor: pointer;
      border-radius: 4px;
      margin-top: 8px;
    }

    #admin-song-list {
      max-height: 400px;
      overflow-y: auto;
      margin-top: var(--gap-md);
    }

    .admin-song-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      font-family: var(--font-tech);
    }

    .admin-delete-btn {
      background: rgba(255, 0, 0, 0.2);
      color: var(--led-red);
      border: 1px solid var(--led-red);
      padding: 4px 8px;
      cursor: pointer;
      border-radius: 4px;
    }
    .cassette-category-block {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(0, 255, 204, 0.2);
      border-radius: 6px;
      padding: 12px;
      margin-bottom: 16px;
    }

    .cassette-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--led-cyan);
      font-family: var(--font-display);
      border-bottom: 1px solid rgba(0, 255, 204, 0.33);
      padding-bottom: 8px;
      margin-bottom: 12px;
    }

    .cassette-track-count {
      font-size: 0.8rem;
      background: rgba(255, 255, 255, 0.08);
      color: var(--led-cyan);
      padding: 2px 10px;
      border-radius: 10px;
      font-family: var(--font-tech);
    }

    .song-items-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .song-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      background: #090d16;
      border-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .song-title {
      color: var(--silver-dark);
      font-family: var(--font-tech);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .song-title strong {
      color: var(--led-cyan);
      margin-right: 6px;
    }

    .song-actions {
      flex-shrink: 0;
    }
    .cassette-empty {
      color: var(--silver-dark);
      font-family: var(--font-tech);
      font-style: italic;
      margin: 4px 8px;
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>

<body>

  <!-- ADMIN LOGIN MODAL -->
  <div class="auth-overlay" id="admin-login-overlay">
    <div class="auth-card">
      <div class="auth-card__icon">🛠️</div>
      <div class="auth-card__title">ADMIN ACCESS</div>
      <div class="auth-card__subtitle">Enter your Supabase credentials</div>

      <div class="admin-input-group">
        <label>Username</label>
        <input type="text" id="admin-email">
      </div>
      <div class="admin-input-group" style="margin-bottom:16px;">
        <label>Password</label>
        <input type="password" id="admin-password">
      </div>

      <div class="auth-error" id="admin-error"></div>

      <button class="google-signin-btn" onclick="AdminModule.login()">Sign In</button>
      <button class="guest-btn" onclick="window.location.href='player.html'">Go back to Player</button>
    </div>
  </div>

  <!-- ADMIN DASHBOARD -->
  <div id="admin-dashboard">
    <div class="admin-header">
      <div class="admin-title">KEYBOARD FANTASIA ADMIN</div>
      <button class="admin-close" onclick="AdminModule.closeDashboard(); window.location.reload();">LOGOUT</button>
    </div>

    <div class="admin-grid-container">
      <!-- LEFT CARD: Upload Media to Storage -->
      <div class="admin-card">
        <h3>Upload Media to Storage</h3>

        <!-- 1. Audio Upload -->
        <div class="admin-form-group">
          <label>Audio File (.mp3, .wav):</label>
          <input type="file" id="upload-audio-file" accept="audio/*" />
          <button type="button" class="admin-btn" onclick="uploadStorageFile('audio')">Upload Audio</button>
        </div>

        <!-- 2. Video Upload -->
        <div class="admin-form-group">
          <label>Video File (.mp4, .webm):</label>
          <input type="file" id="upload-video-file" accept="video/*" />
          <button type="button" class="admin-btn" onclick="uploadStorageFile('video')">Upload Video</button>
        </div>

        <!-- 3. Thumbnail / Image Upload -->
        <div class="admin-form-group">
          <label>Image File (.jpg, .png, .jpeg):</label>
          <input type="file" id="upload-image-file" accept="image/*" />
          <button type="button" class="admin-btn" onclick="uploadStorageFile('images')">Upload Image</button>
        </div>
      </div>

      <!-- RIGHT CARD: Add New Song (Metadata & Links Only) -->
      <div class="admin-card">
        <h3>Add New Song</h3>

        <div class="admin-form-group">
          <label for="cassette-select">Select Cassette ID:</label>
          <select id="cassette-select" class="admin-input">
            <option value="C-1">Cassette 1 (C-1)</option>
            <option value="C-2">Cassette 2 (C-2)</option>
            <option value="C-3">Cassette 3 (C-3)</option>
            <option value="C-4">Cassette 4 (C-4)</option>
            <option value="C-5">Cassette 5 (C-5)</option>
            <option value="C-6">Cassette 6 (C-6)</option>
          </select>
        </div>

        <div class="admin-form-group">
          <label for="song-title">Song / Track Title:</label>
          <input type="text" id="song-title" class="admin-input" placeholder="e.g. Keyboard Fantasia Vol 1" />
        </div>

        <!-- Dedicated Song Thumbnail Uploader -->
        <div class="admin-form-group">
          <label for="song-thumbnail-file">Song Thumbnail Image (.jpg, .png):</label>
          <input type="file" id="song-thumbnail-file" accept="image/*" class="admin-input" onchange="uploadSongThumbnail(this)" />
          <input type="hidden" id="song-thumbnail-url" />
          <span id="thumbnail-upload-status" style="font-size: 12px; color: #aaa;">No thumbnail selected</span>
        </div>

        <!-- Linked Media Indicators from Left Card -->
        <input type="hidden" id="audio-url-input" />
        <input type="hidden" id="video-url-input" />

        <div class="asset-status-summary" style="margin: 10px 0;">
          <p id="status-audio">Audio: <span style="color:#888;">Not uploaded</span></p>
          <p id="status-video">Video: <span style="color:#888;">Not uploaded</span></p>
        </div>

        <div class="admin-form-group">
          <label for="youtube-url-input">Linked YouTube URL (Optional):</label>
          <input type="url" id="youtube-url-input" class="admin-input" placeholder="https://www.youtube.com/watch?v=..." />
        </div>

        <button type="button" class="admin-submit-btn" onclick="saveCassetteTrack()">Save Track</button>
      </div>
    </div>

    <!-- Song List -->
    <div class="admin-panel" style="margin-top:var(--gap-lg);">
      <h3>Manage Songs</h3>
      <div id="admin-song-list"></div>
    </div>
  </div>

  <script src="js/supabase-config.js"></script>
  <script src="js/admin.js"></script>
</body>

</html>
