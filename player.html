<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Keyboard Fantasia by Pradeep N — A nostalgic Panasonic-style cassette stereo media player featuring instrumental renditions of classic songs">
  <title>Keyboard Fantasia — by Pradeep N, Engineer, VSSC</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;900&family=Inter:wght@300;400;500;600;700&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* ============================================================
       KEYBOARD FANTASIA — Image Player Styles
       ============================================================ */

    :root {
      --led-green: #00FF41;
      --led-green-dim: #00AA2B;
      --led-red: #FF3333;
      --silver-dark: #A0A0A0;
      --steel-dark: #6B6E70;
      --gunmetal: #2C2F33;
      
      --font-display: 'Orbitron', monospace;
      --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-tech: 'Rajdhani', sans-serif;
      
      --gap-xs: 4px;
      --gap-sm: 8px;
      --gap-md: 16px;
      --gap-lg: 24px;
      --gap-xl: 32px;
      --gap-2xl: 48px;
      --radius-sm: 4px;
      --radius-xl: 16px;
      --shadow-glow-green: 0 0 8px rgba(0,255,65,0.4), 0 0 24px rgba(0,255,65,0.15);
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html {
      font-size: 16px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      font-family: var(--font-body);
      background: #000;
      color: #fff;
      overflow-x: hidden;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
    }

    /* ── Power State ── */
    .image-player.is-off {
      filter: brightness(0.2) grayscale(0.5);
      pointer-events: none;
    }
    
    .image-player.is-off #power-btn {
      pointer-events: auto; /* Power button always clickable */
    }

    /* ── Image Player Layout ── */
    .image-player {
      position: relative;
      max-width: 1200px;
      width: 100%;
      aspect-ratio: 1024 / 576; /* Based on the background image */
      margin: 0 auto;
      background-image: url('media/images/stereo_bg.jpg');
      background-size: contain;
      background-position: center;
      background-repeat: no-repeat;
    }

    /* Invisible clickable areas that overlay the image */
    .overlay-area {
      position: absolute;
      cursor: pointer;
      /* background: rgba(255, 0, 0, 0.2);  Uncomment to see hitboxes */
    }
    .overlay-area:hover {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
    }

    /* Cassette Switches (Top Center) */
    .cassette-switches {
      position: absolute;
      top: 3%;
      left: 28%;
      width: 44%;
      height: 7%;
      display: flex;
      flex-wrap: wrap;
    }
    
    .cassette-switch {
      width: 33.33%;
      height: 50%;
      cursor: pointer;
      /* border: 1px solid rgba(0,255,0,0.3); */
    }
    
    .cassette-switch:hover {
      background: rgba(255, 255, 255, 0.1);
    }
    
    .cassette-switch.is-active {
      background: rgba(0, 255, 65, 0.2);
    }

    /* Video Screen Area */
    .video-container {
      position: absolute;
      top: 10.5%;
      left: 28%;
      width: 44%;
      height: 31.5%;
      background: #000;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #video-player {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: none;
    }

    .video-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: #000;
      z-index: 2;
    }

    #idle-screen {
      background: radial-gradient(ellipse at center, rgba(0,30,0,0.3) 0%, transparent 70%), #0a0a0a;
    }

    /* EQ Visualizer */
    #eq-visualizer {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1; /* Behind text */
      pointer-events: none;
      opacity: 0.8;
    }

    .video-display__idle-title {
      font-family: var(--font-display);
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--led-green);
      text-shadow: var(--shadow-glow-green);
      letter-spacing: 3px;
      animation: titlePulse 3s ease-in-out infinite;
    }

    .video-display__idle-subtitle {
      font-family: var(--font-tech);
      font-size: 0.85rem;
      color: var(--silver-dark);
      margin-top: 8px;
    }

    /* Now Playing Info */
    #now-playing {
      background: transparent;
      justify-content: flex-end;
      align-items: center;
      padding: 10px;
      pointer-events: none;
      background: linear-gradient(to top, rgba(0,0,0,0.8), transparent 80%);
    }

    .now-playing__text-container {
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      width: 100%;
    }

    .now-playing__title {
      font-family: var(--font-display);
      font-size: 0.8rem;
      color: var(--led-green);
      text-shadow: var(--shadow-glow-green);
    }
    
    .now-playing__movie, .now-playing__director {
      font-family: var(--font-tech);
      font-size: 0.7rem;
      color: #ddd;
    }

    /* Song List Overlay */
    #song-list {
      background: rgba(0,0,0,0.9);
      backdrop-filter: blur(5px);
      z-index: 10;
      display: none;
      align-items: stretch;
      flex-direction: column;
    }
    
    #song-list.is-open {
      display: flex;
    }

    .song-list__header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px;
      border-bottom: 1px solid rgba(0,255,65,0.3);
    }

    .song-list__title {
      font-family: var(--font-display);
      font-size: 0.8rem;
      color: var(--led-green);
    }

    .song-list__close {
      background: none;
      border: 1px solid var(--steel-dark);
      color: #fff;
      cursor: pointer;
      padding: 2px 8px;
      border-radius: 4px;
    }

    #song-list-tracks {
      flex: 1;
      overflow-y: auto;
      text-align: left;
    }

    .song-list__track {
      display: flex;
      align-items: center;
      padding: 8px 10px;
      cursor: pointer;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      font-family: var(--font-tech);
    }

    .song-list__track:hover {
      background: rgba(255,255,255,0.1);
    }

    .song-list__track.is-playing {
      background: rgba(0,255,65,0.1);
      color: var(--led-green);
    }

    .song-list__track-num {
      width: 25px;
      color: var(--steel-dark);
    }

    .song-list__track-info {
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    
    .song-list__track-title { font-size: 0.9rem; }
    .song-list__track-meta { font-size: 0.7rem; color: #aaa; }

    /* Transport Controls */
    /* Based on image: Left block of buttons and Right block of buttons around the central dial */
    
    #btn-rewind { top: 57%; left: 36.5%; width: 3.5%; height: 5%; }
    #btn-play { top: 57%; left: 40.5%; width: 3.5%; height: 5%; }
    
    #btn-ff { top: 57%; left: 56%; width: 3.5%; height: 5%; }
    #btn-stop { top: 57%; left: 60%; width: 3.5%; height: 5%; }

    .transport-btn-area {
      position: absolute;
      cursor: pointer;
      border-radius: 4px;
    }
    .transport-btn-area:hover {
      background: rgba(255, 255, 255, 0.2);
    }
    .transport-btn-area:active, .transport-btn-area.is-active {
      background: rgba(0, 255, 65, 0.3);
    }

    /* Volume Dial */
    .volume-dial-area {
      position: absolute;
      top: 48%;
      left: 44.5%;
      width: 11%;
      height: auto;
      aspect-ratio: 1 / 1;
      border-radius: 50%;
      cursor: grab;
      touch-action: none;
    }
    .volume-dial-area:active { cursor: grabbing; }

    .dial-body {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      /* We map the actual rotation to this invisible element or a visible overlay */
      position: relative;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }
    
    /* A small indicator dot to show rotation on the dial */
    .dial-indicator {
      position: absolute;
      top: 10%;
      left: 50%;
      width: 6px;
      height: 6px;
      background: var(--led-green);
      border-radius: 50%;
      transform: translateX(-50%);
      box-shadow: 0 0 5px var(--led-green);
    }

    #volume-value {
      position: absolute;
      bottom: -20px;
      left: 50%;
      transform: translateX(-50%);
      font-family: var(--font-display);
      font-size: 0.8rem;
      color: var(--led-green);
      text-shadow: var(--shadow-glow-green);
      pointer-events: none;
    }

    /* ── Hardware Elements ── */
    #power-btn {
      position: absolute;
      top: 61%;
      left: 67%;
      width: 3.5%;
      height: 6%;
      border-radius: 50%;
      cursor: pointer;
      background: rgba(255, 51, 51, 0.4);
      box-shadow: 0 0 10px rgba(255, 51, 51, 0.6);
      transition: all 0.3s ease;
    }
    
    .image-player:not(.is-off) #power-btn {
      background: rgba(0, 255, 65, 0.4);
      box-shadow: 0 0 10px rgba(0, 255, 65, 0.6);
    }
    
    #power-btn:hover {
      filter: brightness(1.5);
    }

    @keyframes typeText {
      to { opacity: 1; }
    }

    .woofer-overlay {
      position: absolute;
      top: 68%;
      width: 17%;
      aspect-ratio: 1;
      border-radius: 50%;
      background: radial-gradient(circle, transparent 40%, rgba(0,0,0,0.5) 100%);
      transform-origin: center center;
      pointer-events: none;
      /* The scale is driven by CSS var updated in JS */
      transform: scale(var(--bass-scale, 1)); 
    }
    .woofer-overlay.left { left: 4.8%; }
    .woofer-overlay.right { left: 78.5%; }

    /* Cassette Spin Video */
    #cassette-spin-video {
      position: absolute;
      top: 70%; /* Positioned in Cassette Deck */
      left: 28%;
      width: 44%;
      height: 20%;
      object-fit: cover;
      border-radius: 4px;
      z-index: 10;
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
      background: #000;
    }
    .image-player.is-playing #cassette-spin-video {
      opacity: 1;
    }



    /* ── Admin Dashboard ── */
    #admin-dashboard {
      position: fixed;
      inset: 0;
      z-index: 10000;
      background: rgba(10, 10, 15, 0.95);
      backdrop-filter: blur(10px);
      display: none;
      flex-direction: column;
      padding: var(--gap-xl);
      overflow-y: auto;
    }
    #admin-dashboard.is-open { display: flex; }
    
    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--led-green);
      padding-bottom: var(--gap-md);
      margin-bottom: var(--gap-lg);
    }
    
    .admin-title {
      font-family: var(--font-display);
      font-size: 1.5rem;
      color: var(--led-green);
    }
    
    .admin-close {
      background: transparent;
      border: 1px solid var(--led-red);
      color: var(--led-red);
      padding: 8px 16px;
      cursor: pointer;
      font-family: var(--font-tech);
      border-radius: 4px;
    }
    .admin-close:hover { background: rgba(255,0,0,0.1); }
    
    .admin-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--gap-lg);
    }
    
    .admin-panel {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      padding: var(--gap-md);
      border-radius: var(--radius-md);
    }
    
    .admin-panel h3 {
      font-family: var(--font-display);
      color: var(--led-cyan);
      margin-bottom: var(--gap-md);
      font-size: 1rem;
    }
    
    .admin-input-group {
      margin-bottom: var(--gap-sm);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    
    .admin-input-group label {
      font-family: var(--font-tech);
      font-size: 0.8rem;
      color: var(--silver-dark);
    }
    
    .admin-input-group input, .admin-input-group select {
      background: #000;
      border: 1px solid var(--steel-dark);
      color: #fff;
      padding: 8px;
      font-family: var(--font-body);
      border-radius: 4px;
    }
    
    .admin-btn {
      background: var(--led-green-dim);
      color: #000;
      border: none;
      padding: 8px 16px;
      font-family: var(--font-display);
      cursor: pointer;
      border-radius: 4px;
      margin-top: 8px;
    }
    .admin-btn:hover { background: var(--led-green); }
    
    #admin-song-list {
      max-height: 400px;
      overflow-y: auto;
      margin-top: var(--gap-md);
    }
    
    .admin-song-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      font-family: var(--font-tech);
    }
    .admin-delete-btn {
      background: rgba(255,0,0,0.2);
      color: var(--led-red);
      border: 1px solid var(--led-red);
      padding: 2px 8px;
      cursor: pointer;
      border-radius: 4px;
    }

    /* Auth Overlay */
    .auth-overlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(5, 5, 15, 0.92);
      backdrop-filter: blur(20px);
      opacity: 0;
      transition: opacity 0.5s ease;
    }
    .auth-overlay.is-visible { opacity: 1; }

    .auth-card {
      width: 380px;
      max-width: 90vw;
      background: linear-gradient(145deg, rgba(30,33,37,0.95) 0%, rgba(15,15,20,0.98) 100%);
      border: 1px solid rgba(0,255,65,0.15);
      border-radius: var(--radius-xl);
      padding: var(--gap-2xl) var(--gap-xl);
      box-shadow: 0 0 60px rgba(0,255,65,0.06), 0 25px 80px rgba(0,0,0,0.7);
      text-align: center;
      position: relative;
    }

    .auth-card__icon {
      font-size: 2.5rem;
      margin-bottom: var(--gap-md);
      animation: titlePulse 3s ease-in-out infinite;
    }

    .auth-card__title {
      font-family: var(--font-display);
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--led-green);
      text-shadow: var(--shadow-glow-green);
      margin-bottom: var(--gap-xs);
    }

    .auth-card__subtitle {
      font-family: var(--font-tech);
      font-size: 0.85rem;
      color: var(--silver-dark);
      margin-bottom: var(--gap-xl);
    }

    .google-signin-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 14px 24px;
      background: #ffffff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-family: var(--font-body);
      font-size: 0.95rem;
      font-weight: 600;
      color: #3c4043;
      margin-bottom: var(--gap-md);
    }
    .google-signin-btn svg { width: 20px; height: 20px; }

    .guest-btn {
      display: block;
      width: 100%;
      padding: 12px;
      background: transparent;
      border: 1px solid var(--steel-dark);
      border-radius: 8px;
      color: var(--silver-dark);
      font-family: var(--font-tech);
      cursor: pointer;
    }
    .guest-btn:hover {
      border-color: var(--led-green-dim);
      color: var(--led-green);
    }

    /* User Badge */
    .user-badge {
      position: fixed;
      top: 12px;
      right: 12px;
      z-index: 1000;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 14px 6px 6px;
      background: linear-gradient(135deg, rgba(30,33,37,0.92) 0%, rgba(15,15,20,0.95) 100%);
      border: 1px solid rgba(0,255,65,0.15);
      border-radius: 40px;
      opacity: 0;
      transform: translateY(-10px);
      transition: all 0.4s ease;
      pointer-events: none;
    }
    .user-badge.is-visible {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }
    .user-badge__avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--gunmetal);
      border: 2px solid var(--led-green-dim);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-display);
      font-size: 0.7rem;
      color: var(--led-green);
      overflow: hidden;
    }
    .user-badge__avatar img { width: 100%; height: 100%; object-fit: cover; }
    .user-badge__info { display: flex; flex-direction: column; gap: 1px; }
    .user-badge__name { font-family: var(--font-tech); font-size: 0.72rem; color: var(--led-green); }
    .user-badge__email { font-family: var(--font-body); font-size: 0.55rem; color: var(--silver-dark); }
    .user-badge__signout {
      margin-left: 6px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 1px solid var(--steel-dark);
      background: transparent;
      color: var(--silver-dark);
      cursor: pointer;
    }

    @keyframes titlePulse {
      0%, 100% { opacity: 0.7; text-shadow: 0 0 8px rgba(0,255,65,0.3); }
      50% { opacity: 1; text-shadow: 0 0 20px rgba(0,255,65,0.6), 0 0 40px rgba(0,255,65,0.2); }
    }

  </style>

  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>


  <!-- ADMIN LOGIN MODAL -->
  <div class="auth-overlay" id="admin-login-overlay" style="display: none;">
    <div class="auth-card">
      <div class="auth-card__icon">🛠️</div>
      <div class="auth-card__title">ADMIN ACCESS</div>
      <div class="auth-card__subtitle">Enter your Supabase credentials</div>
      
      <div class="admin-input-group" style="text-align:left; margin-bottom:12px;">
        <label>Username</label>
        <input type="text" id="admin-email" placeholder="admin">
      </div>
      <div class="admin-input-group" style="text-align:left; margin-bottom:16px;">
        <label>Password</label>
        <input type="password" id="admin-password">
      </div>
      
      <div class="auth-error" id="admin-error"></div>
      
      <button class="google-signin-btn" onclick="AdminModule.login()" style="justify-content:center; background:var(--led-green); color:#000;">
        Sign In
      </button>
      <button class="guest-btn" onclick="document.getElementById('admin-login-overlay').classList.remove('is-visible'); setTimeout(() => document.getElementById('admin-login-overlay').style.display='none', 500);">Cancel</button>
    </div>
  </div>

  <!-- ADMIN DASHBOARD -->
  <div id="admin-dashboard">
    <div class="admin-header">
      <div class="admin-title">KEYBOARD FANTASIA ADMIN</div>
      <button class="admin-close" onclick="AdminModule.closeDashboard()">LOGOUT & CLOSE</button>
    </div>
    
    <div class="admin-grid">
      <!-- Upload Media -->
      <div class="admin-panel">
        <h3>Upload Media to Storage</h3>
        <div class="admin-input-group">
          <label>File (MP3, MP4, JPG)</label>
          <input type="file" id="admin-upload-file">
        </div>
        <button class="admin-btn" onclick="AdminModule.uploadFile()">Upload File</button>
        <div id="upload-status" style="margin-top:8px; font-family:var(--font-tech); font-size:0.8rem;"></div>
      </div>
      
      <!-- Add New Song -->
      <div class="admin-panel">
        <h3>Add New Song</h3>
        <div class="admin-input-group">
          <label>Cassette ID (e.g. C1)</label>
          <input type="text" id="admin-song-cassette" value="C1">
        </div>
        <div class="admin-input-group">
          <label>Title</label>
          <input type="text" id="admin-song-title">
        </div>
        <div class="admin-input-group">
          <label>Movie</label>
          <input type="text" id="admin-song-movie">
        </div>
        <div class="admin-input-group">
          <label>Audio URL</label>
          <input type="text" id="admin-song-audio">
        </div>
        <button class="admin-btn" onclick="AdminModule.addSong()">Save Song</button>
      </div>
    </div>
    
    <!-- Song List -->
    <div class="admin-panel" style="margin-top:var(--gap-lg);">
      <h3>Manage Songs</h3>
      <div id="admin-song-list">
        <!-- Populated via JS -->
      </div>
    </div>
  </div>

  <!-- USER BADGE -->
  <div class="user-badge" id="user-badge">
    <div class="user-badge__avatar" id="user-badge-avatar">G</div>
    <div class="user-badge__info">
      <div class="user-badge__name" id="user-badge-name">Guest</div>
      <div class="user-badge__email" id="user-badge-email"></div>
    </div>
    <button class="user-badge__signout" id="user-badge-signout" onclick="AuthModule.signOut()" title="Sign out">✕</button>
  </div>

  <!-- IMAGE PLAYER WRAPPER -->
  <div class="image-player is-off" id="image-player-wrapper">
    
    <!-- POWER BUTTON (Green button on lower right) -->
    <div id="power-btn" title="Master Power"></div>
    
    <!-- WOOFER PHYSICS OVERLAYS -->
    <div class="woofer-overlay left"></div>
    <div class="woofer-overlay right"></div>
    
    <!-- CASSETTE SPIN VIDEO -->
    <video id="cassette-spin-video" src="media/images/spin.mp4" muted loop playsinline></video>
    
    <!-- Cassette Switches (Top center of the image) -->
    <div class="cassette-switches" id="cassette-switches">
      <div class="cassette-switch" data-cassette="C1"></div>
      <div class="cassette-switch" data-cassette="C2"></div>
      <div class="cassette-switch" data-cassette="C3"></div>
      <div class="cassette-switch" data-cassette="C4"></div>
      <div class="cassette-switch" data-cassette="C5"></div>
      <div class="cassette-switch" data-cassette="C6"></div>
    </div>

    <!-- Video Display Area -->
    <div class="video-container">
      <video id="video-player" playsinline></video>
      
      <div id="idle-screen" class="video-overlay">
        <div class="video-display__idle-title" id="deck-label" style="cursor:pointer;" title="Click for Admin Access" onclick="AdminModule.openLogin()">KEYBOARD FANTASIA</div>
        <div class="video-display__idle-subtitle">SELECT A CASSETTE TO PLAY</div>
      </div>
      
      <div id="boot-screen" class="video-overlay" style="display:none; background: #000; z-index: 20;">
        <div style="color: var(--led-green); font-family: var(--font-display); font-size: 0.9rem; text-align: left; width: 100%; padding: 20px;">
          <div class="boot-text" style="opacity: 0; animation: typeText 0.1s forwards;">SYSTEM STARTING...</div>
          <div class="boot-text" style="opacity: 0; animation: typeText 0.1s forwards; animation-delay: 0.5s;">VSSC AUDIO ENGINE v1.0</div>
          <div class="boot-text" style="opacity: 0; animation: typeText 0.1s forwards; animation-delay: 1.0s;">INITIALIZING... OK</div>
        </div>
      </div>

      <div id="now-playing" class="video-overlay" style="display:none;">
        <canvas id="eq-visualizer"></canvas>
        <div class="now-playing__text-container">
          <div class="now-playing__title" id="np-title">Song Title</div>
          <div class="now-playing__movie" id="np-movie">Movie</div>
          <div class="now-playing__director" id="np-director">Director</div>
          <div class="now-playing__time" id="np-time">0:00 / 0:00</div>
        </div>
      </div>

      <div id="song-list" class="video-overlay">
        <div class="song-list__header">
          <div class="song-list__title" id="song-list-title">Cassette Name</div>
          <button class="song-list__close" id="song-list-close">✕</button>
        </div>
        <div id="song-list-tracks"></div>
      </div>
    </div>

    <!-- Transport Buttons -->
    <div class="transport-btn-area" id="btn-rewind" title="Rewind"></div>
    <div class="transport-btn-area" id="btn-play" title="Play"></div>
    <div class="transport-btn-area" id="btn-ff" title="Fast Forward"></div>
    <div class="transport-btn-area" id="btn-stop" title="Stop"></div>

    <!-- Volume Dial -->
    <div id="volume-dial" class="volume-dial-area" title="Volume">
      <div id="dial-body" class="dial-body">
        <div class="dial-indicator"></div>
      </div>
      <div id="volume-value">50</div>
    </div>



  </div>

  <script src="js/supabase-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/data-service.js"></script>
  <script src="js/webaudio.js"></script>
  <script type="module" src="js/app.js"></script>

</body>
</html>
